{% load static %}
<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Redes Sociales</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005A9C",
                        "secondary": "#FF9800",
                        "background-light": "#F4F6F8",
                        "background-dark": "#101c22",
                        "text-light": "#333333",
                        "text-dark": "#F4F6F8",
                        "text-muted-light": "#666666",
                        "text-muted-dark": "#a0aec0",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "2xl": "1rem",
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">

            <!-- NAVBAR -->
            <header class="flex items-center justify-between whitespace-nowrap bg-white dark:bg-background-dark border-b border-gray-200 dark:border-gray-700 px-10 py-3 shadow-sm sticky top-0 z-50">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-3">
                        <img src="{% static 'img/logoClubAlmacen.png' %}" alt="Logo de la Plataforma" class="h-24 w-auto"/>
                    </div>
                    <nav class="hidden md:flex gap-6 text-text-muted-light dark:text-text-muted-dark font-semibold text-sm">
                        <a href="{% url 'plataforma_comerciante' %}" class="hover:text-primary transition-colors">Plataforma</a>
                        <a href="{% url 'directorio' %}" class="hover:text-primary transition-colors">Proveedores</a> 
                        <a href="{% url 'beneficios' %}" class="hover:text-primary transition-colors">Beneficios</a>
                        <a href="{% url 'comerciantes' %}" class="hover:text-primary transition-colors">Comerciantes</a>
                        <a href="{% url 'redes_sociales' %}" class="text-primary transition-colors">Redes Sociales</a>
                        <a href="{% url 'perfil' %}" class="hover:text-primary transition-colors">Perfil</a>
                    </nav>
                </div>
                <div class="flex justify-end gap-4 items-center">
                    <button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 w-10 bg-transparent text-text-muted-light dark:text-text-muted-dark hover:bg-gray-100 dark:hover:bg-gray-700">
                        <span class="material-symbols-outlined text-2xl">notifications</span>
                    </button>
                </div>
            </header>

            <!-- CONTENIDO -->
            <main class="flex-1 w-full max-w-screen-xl mx-auto p-6 lg:p-8">
                <h1 class="text-3xl font-black text-text-light dark:text-text-dark mb-2">Redes Sociales Oficiales</h1>
                <p class="text-text-muted-light dark:text-text-muted-dark mb-8">
                    Síguenos en nuestras redes para enterarte de novedades, eventos y contenido exclusivo para comerciantes.
                </p>

                <!-- CONTENEDOR DE TARJETAS, CENTRADO -->
                <div class="flex flex-col items-center">
                    <div class="flex flex-wrap justify-center gap-6 max-w-3xl">

                        <!-- FACEBOOK -->
                        <a href="https://www.facebook.com/ClubAlmacenChile/" target="_blank"
                           class="w-56 h-32 rounded-2xl bg-[#1877F2] text-white flex flex-col items-center justify-center shadow-lg hover:shadow-xl hover:scale-105 transition transform">
                            <p class="text-sm font-semibold">Facebook</p>
                        </a>

                        <!-- INSTAGRAM -->
                        <a href="https://www.instagram.com/clubalmacen/?hl=es-la" target="_blank"
                           class="w-56 h-32 rounded-2xl bg-gradient-to-r from-pink-500 via-red-500 to-yellow-400 text-white flex flex-col items-center justify-center shadow-lg hover:shadow-xl hover:scale-105 transition transform">
                            <p class="text-sm font-semibold">Instagram</p>
                        </a>

                        <!-- YOUTUBE -->
                        <a href="https://www.youtube.com/@misoporteclubalmacen145" target="_blank"
                           class="w-56 h-32 rounded-2xl bg-[#FF0000] text-white flex flex-col items-center justify-center shadow-lg hover:shadow-xl hover:scale-105 transition transform">
                            <p class="text-sm font-semibold">YouTube</p>
                        </a>
                        
                        <!-- X / TWITTER -->
                        <a href="https://x.com/clubalmacen" target="_blank"
                           class="w-56 h-32 rounded-2xl bg-[#111111] text-white flex flex-col items-center justify-center shadow-lg hover:shadow-xl hover:scale-105 transition transform">
                            <p class="text-sm font-semibold">Twitter (X)</p>
                        </a>

                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
